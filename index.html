<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fillerbuster - 3DV 2026 Poster</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    --blue: #2d7fc1; --blue-light: #e3f0fa;
    --orange: #e8943a; --orange-light: #fdf0e0;
    --teal: #2aaa8a; --purple: #7c5cbf; --red: #d94f4f;
    --text: #222; --text-light: #555;
    --bg: #f0ece6; --card-bg: #fff;
    --gap: 3mm; --pad: 10mm;
    --font-scale: 1.3;
  }
  @page { size: 841mm 594mm; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: 'Nunito', sans-serif; color: var(--text); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { width: 841mm; height: 594mm; background: var(--bg); overflow: hidden; transform-origin: top left; }
  #root { width: 100%; height: 100%; display: grid; grid-template-rows: auto 1fr; }
  @media screen { html { background:#bbb; overflow:hidden; width:100vw; height:100vh; } body { position:absolute; box-shadow:0 4px 30px rgba(0,0,0,.3); border-radius:4px; } }
  @media print { html { background:none; } body { position:static; transform:none!important; box-shadow:none; border-radius:0; } .toolbar,.divider,.swap-handle,.drop-zone{display:none!important;} }
  body.preview .divider, body.preview .swap-handle, body.preview .drop-zone { display:none!important; }

  /* === HEADER === */
  .header { background: linear-gradient(135deg,#1b4f7a,#2d7fc1 50%,#45a0e0); padding:6mm var(--pad) 5mm; display:flex; align-items:center; gap:8mm; }
  .header-left { flex:1; }
  .header h1 { font-size:34pt; font-weight:900; line-height:1.1; color:#fff; margin-bottom:2mm; }
  .header h1 .m { color:#ffd060; }
  .header .authors { font-size:18pt; color:rgba(255,255,255,.9); font-weight:700; }
  .header .authors sup { font-size:11pt; color:#ffd060; }
  .header .aff { font-size:15pt; color:rgba(255,255,255,.7); margin-top:1.5mm; }
  .header .aff sup { color:#ffd060; font-size:10pt; }
  .header-logos { display:flex; align-items:center; justify-content:center; gap:10mm; flex-shrink:0; }
  .header-logos img { height:28mm; object-fit:contain; filter:brightness(0) invert(1); opacity:.85; }
  .header-right { display:flex; flex-direction:row; align-items:center; gap:6mm; }
  .badge { font-size:16pt; font-weight:900; color:#fff; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5); padding:1.5mm 6mm; border-radius:2mm; }
  .header-right .qr img { width:24mm; height:24mm; border-radius:1.5mm; background:#fff; padding:.8mm; }
  .header-right .ql { font-size:8pt; color:#ffd060; font-weight:800; text-align:center; }
  .header-right .qr { text-align:center; }

  /* === POSTER — 3 flex columns === */
  .poster { display:flex; gap:var(--gap); padding:var(--gap) var(--pad); min-height:0; flex:1; overflow:hidden; }
  .col { display:flex; flex-direction:column; gap:var(--gap); min-height:0; overflow:hidden; }

  /* === CARD === */
  .card { background:var(--card-bg); border-radius:2.5mm; padding:3mm 4mm; box-shadow:0 1px 3px rgba(0,0,0,.08); border-top:2.5px solid var(--blue); display:flex; flex-direction:column; overflow:hidden; min-height:0; flex:0 0 auto; position:relative; transition: outline .15s; }
  .card.grow { flex:1 1 0; }
  .card.orange { border-top-color:var(--orange); }
  .card.teal   { border-top-color:var(--teal); }
  .card.purple { border-top-color:var(--purple); }
  .card.red    { border-top-color:var(--red); }

  .card h2 { font-size:calc(11pt * var(--font-scale)); font-weight:800; margin-bottom:1.5mm; flex-shrink:0; color:var(--blue); }
  .card.orange h2{color:var(--orange);} .card.teal h2{color:var(--teal);} .card.purple h2{color:var(--purple);} .card.red h2{color:var(--red);}
  .card p,.card li { font-size:calc(9.5pt * var(--font-scale)); line-height:1.3; }
  .card ul,.card ol { padding-left:5mm; flex-shrink:0; }
  .card li { margin-bottom:.8mm; }
  .card li::marker { font-weight:700; }

  .hl { background:var(--blue-light); border-left:2.5px solid var(--blue); padding:2.5mm 3.5mm; border-radius:0 1.5mm 1.5mm 0; margin-bottom:1.5mm; flex-shrink:0; }
  .hl p { font-size:calc(9.5pt * var(--font-scale)); line-height:1.35; font-weight:600; }

  /* Figure — fills remaining card space */
  .fig { flex:1; display:flex; flex-direction:column; min-height:0; margin:1mm 0; }
  .fig-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; overflow:hidden; }
  .fig-wrap img { width:100%; height:100%; object-fit:contain; border-radius:1.5mm; display:block; }
  .fig .cap { font-size:calc(7.5pt * var(--font-scale)); color:var(--text-light); margin-top:.8mm; line-height:1.2; flex-shrink:0; }
  .fig .cap b { color:var(--text); }

  table { width:100%; border-collapse:collapse; font-size:calc(9pt * var(--font-scale)); margin:1.5mm 0; }
  thead th { background:var(--blue); color:#fff; padding:1.5mm 2.5mm; text-align:left; font-weight:700; font-size:calc(8.5pt * var(--font-scale)); }
  tbody td { padding:1.2mm 2.5mm; border-bottom:1px solid #eee; }
  tbody tr:nth-child(even) { background:#f8f9fb; }
  .best { font-weight:800; color:var(--orange); }
  .katex { font-size:calc(10pt * var(--font-scale))!important; }
  .eq { background:var(--orange-light); border:1px solid var(--orange); border-radius:1.5mm; padding:1.5mm 2.5mm; margin:1.5mm 0; text-align:center; flex-shrink:0; }
  .links { display:flex; align-items:center; gap:3mm; background:var(--blue-light); padding:2.5mm 3.5mm; border-radius:1.5mm; margin-top:2mm; flex-shrink:0; }
  .links .qr img { width:18mm; height:18mm; border-radius:1mm; }
  .links .ll { font-size:calc(8.5pt * var(--font-scale)); line-height:1.5; }
  .links .ll b { color:var(--blue); }

  /* Footer */
  .footer { background:#e5e0da; padding:2mm var(--pad); font-size:7.5pt; color:var(--text-light); line-height:1.25; display:flex; align-items:center; justify-content:space-between; }
  .footer .made { display:flex; align-items:center; gap:1.5mm; opacity:.6; flex-shrink:0; margin-left:5mm; }
  .footer .made img { width:8mm; height:8mm; border-radius:.8mm; }
  .footer .made span { font-size:6.5pt; color:#888; }
  .footer .made strong { color:var(--blue); }

  /* === TOOLBAR (screen only) === */
  .toolbar { position:fixed; top:8px; right:8px; z-index:1000; display:flex; gap:6px; align-items:center; }
  .toolbar button { font-family:'Nunito'; font-size:11px; font-weight:700; padding:5px 12px; border-radius:6px; border:none; cursor:pointer; background:#eee; color:#555; }
  .toolbar button:hover { background:#ddd; }

  /* Swap handles — click to select, click another to swap */
  .card .swap-handle { position:absolute; top:1.5mm; right:1.5mm; width:8mm; height:8mm; background:var(--blue); color:#fff; border-radius:1.5mm; font-size:9pt; text-align:center; line-height:8mm; cursor:pointer; z-index:10; user-select:none; opacity:.4; transition: opacity .15s, background .15s, transform .15s; }
  .card .swap-handle:hover { opacity:.8; transform:scale(1.15); }
  .card.swap-selected { outline:3px solid var(--orange); outline-offset:-1px; }
  .card.swap-selected .swap-handle { background:var(--orange); opacity:1; transform:scale(1.2); }

  /* Shared divider style */
  .divider { position:relative; z-index:50; flex-shrink:0; }
  .divider::after { content:''; position:absolute; background:rgba(45,127,193,.12); border-radius:1.5mm; transition:background .15s; }
  .divider:hover::after, .divider.active::after { background:rgba(45,127,193,.5); }

  /* Column dividers (vertical bars between columns) */
  .col-resize { width:6mm; cursor:col-resize; margin:0 -3mm; }
  .col-resize::after { top:0; bottom:0; left:1.5mm; width:3mm; }

  /* Row dividers (horizontal bars between cards) */
  .row-resize { height:6mm; cursor:row-resize; margin:-3mm 0; }
  .row-resize::after { left:0; right:0; top:1.5mm; height:3mm; }

  /* Drop zones */
  .drop-zone { height:0; position:relative; z-index:60; transition: height .15s; }
  .drop-zone.visible { height:5mm; }
  .drop-zone-inner { position:absolute; left:2mm; right:2mm; top:0; bottom:0; border-radius:1.5mm; background:rgba(232,148,58,.15); border:2px dashed var(--orange); transition: background .15s; cursor:pointer; }
  .drop-zone.visible .drop-zone-inner { }
  .drop-zone-inner:hover { background:rgba(232,148,58,.35); }
</style>

<script type="text/babel">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

/* ================================================================
   CONSTANTS
   ================================================================ */
const MM = 3.7795275591;

/* ================================================================
   CARD REGISTRY — each card's content config
   ================================================================ */
const CARD_REGISTRY = {
  tldr: {
    title: 'TL;DR',
    color: null, // default blue
    grow: false,
    body: (
      <>
        <div className="hl"><p>A unified multi-view diffusion model that jointly completes images and recovers camera poses for casually captured 3D scenes.</p></div>

    ),

    color: 'orange',
    grow: false,
    body: (
      <div className="fig"><div className="fig-wrap"><img src="problem-difficulty.png" alt="Problem" /></div>
      <div className="cap"><b>Our setting.</b> Casual captures have hundreds of frames. Single-view methods can't encode the full context.</div></div>
    ),
  },
  scenes: {
    title: 'Scene Completion Results',
    color: null,
    grow: true,
    body: (
      <div className="fig"><div className="fig-wrap"><img src="completing-casual-captures.png" alt="Results" /></div>
      <div className="cap"><b>Nerfbusters dataset.</b> 16&ndash;40 conditioning images &rarr; 24 novel views. Most consistent completions vs. baselines.</div></div>
    ),
  },
  teaser: {
    title: 'Completing Casual Captures',
    color: 'purple',
    grow: false,
    body: (
      <div className="fig"><div className="fig-wrap"><img src="teaser.png" alt="Teaser" /></div>
      <div className="cap"><b>Completing casual captures.</b> Incomplete capture (left) &rarr; consistent novel views (right) for complete reconstruction.</div></div>
    ),
  },
  arch: {
    title: 'Model Architecture',
    color: 'teal',
    grow: true,
    body: (
      <>
        <div className="fig"><div className="fig-wrap"><img src="model-architecture.jpg" alt="Architecture" /></div></div>
        <ul>
          <li>Latent DiT (650M params) trained with flow matching on multi-view images + poses</li>
          <li>Separate VAEs for images and raymaps (6-ch ray origins + directions)</li>
          <li>Flexible masking: any mix of known/unknown images and poses</li>
          <li>Index embeddings for variable sequence lengths at inference</li>
        </ul>
        <div className="eq">{'$s_{i,t} = \\tilde{z}^{I}_{i,t} \\oplus \\mathcal{E}^{I}(I_i \\odot \\mathcal{M}_i^{I}) \\oplus \\mathcal{D}(\\mathcal{M}_i^{I}) \\oplus \\tilde{z}^{R}_{i,t} \\oplus \\mathcal{E}^{R}(R_i \\odot \\mathcal{M}_i^{R}) \\oplus \\mathcal{D}(\\mathcal{M}_i^{R})$'}</div>
      </>
    ),
  },
  uncal: {
    title: 'Uncalibrated Scene Completion',
    color: 'orange',
    grow: false,
    body: (
      <div className="fig"><div className="fig-wrap"><img src="uncalibrated-completion.png" alt="Uncalibrated" /></div>
      <div className="cap"><b>From unposed photos to complete scenes.</b> 16 uncalibrated images &rarr; poses &rarr; novel views.</div></div>
    ),
  },
  samples: {
    title: 'Model Samples',
    color: 'purple',
    grow: false,
    body: (
      <div className="fig"><div className="fig-wrap"><img src="model-samples.png" alt="Samples" /></div>
      <div className="cap"><b>Joint inpainting.</b> Yellow = unknown. 16 images inpainted in 24 denoising steps with self-consistent completions.</div></div>
    ),
  },
  quant: {
    title: 'Quantitative Results',
    color: 'orange',
    grow: false,
    body: (
      <>
        <p style={{fontSize:'calc(9.5pt * var(--font-scale))',color:'var(--text-light)',marginBottom:'.8mm'}}><b style={{color:'var(--text)'}}>NeRFiller Dataset</b></p>
        <table><thead><tr><th>Method</th><th>PSNR&uarr;</th><th>SSIM&uarr;</th><th>LPIPS&darr;</th></tr></thead>
        <tbody><tr><td>NeRFiller</td><td>25.57</td><td>0.89</td><td>0.182</td></tr>
        <tr><td><b>Fillerbuster</b></td><td className="best">29.60</td><td className="best">0.92</td><td className="best">0.096</td></tr></tbody></table>
        <p style={{fontSize:'calc(9.5pt * var(--font-scale))',color:'var(--text-light)',marginTop:'2mm',marginBottom:'.8mm'}}><b style={{color:'var(--text)'}}>Model Ablations</b> &mdash; 16-view</p>
        <table><thead><tr><th>Variant</th><th>PSNR&uarr;</th><th>SSIM&uarr;</th><th>LPIPS&darr;</th></tr></thead>
        <tbody><tr><td>no-index-emb</td><td>14.06</td><td>.450</td><td>.400</td></tr>
        <tr><td>fixed-index-emb</td><td>12.14</td><td>.390</td><td>.491</td></tr>
        <tr><td>no-poses</td><td>14.73</td><td>.461</td><td>.384</td></tr>
        <tr><td><b>Fillerbuster</b></td><td className="best">17.20</td><td className="best">.485</td><td className="best">.281</td></tr></tbody></table>
      </>
    ),
  },
  nerfiller: {
    title: 'NeRFiller Dataset Results',
    color: 'teal',
    grow: true,
    body: (
      <div className="fig"><div className="fig-wrap"><img src="nerfiller-results.png" alt="NeRFiller" /></div>
      <div className="cap"><b>Masked 3D region completion.</b> Higher quality than NeRFiller without depth supervision or iterative updates.</div></div>
    ),
  },
  concl: {
    title: 'Conclusion & Links',
    color: 'red',
    grow: false,
    body: (
      <>
        <ul>
          <li>First unified model for scene completion + pose recovery</li>
          <li>Non-autoregressive joint denoising for consistency</li>
          <li>Open-source: model, weights, training code</li>
        </ul>
        <div className="links">
          <div className="ll"><b>Project:</b> ethanweber.me/fillerbuster<br /><b>Code:</b> github.com/facebookresearch/fillerbuster</div>
        </div>
      </>
    ),
  },
};

/* ================================================================
   DEFAULT LAYOUT
   ================================================================ */
const DEFAULT_LAYOUT = {
  columns: [
    { id: 'col1', widthMm: 301, cards: ['tldr', 'problem', 'arch', 'samples'] },
    { id: 'col2', widthMm: null, cards: ['teaser', 'uncal', 'scenes'] },
    { id: 'col3', widthMm: 234, cards: ['quant', 'nerfiller', 'concl'] },
  ],
};
const DEFAULT_CARD_HEIGHTS = { "problem": 127.06, "uncal": 125.47 };
const DEFAULT_FONT_SCALE = 2.2;

/* Logos — add files to poster/logos/ and list them here */
const DEFAULT_LOGOS = [
  { src: 'logos/meta.png', alt: 'Meta Reality Labs', heightMm: 18 },
  { src: 'logos/bair.png', alt: 'BAIR', heightMm: 18 },
];

/* Deep clone helper */
function cloneLayout(layout) {
  return {
    columns: layout.columns.map(c => ({
      id: c.id,
      widthMm: c.widthMm,
      cards: [...c.cards],
    })),
  };
}

/* ================================================================
   CONFIG PERSISTENCE
   ================================================================ */
const LS_KEY = 'posterConfig';

function getFullConfig(layout, cardHeights, fontScale, logos) {
  return {
    columns: layout.columns,
    cardHeights: cardHeights,
    fontScale: fontScale,
    logos: logos,
  };
}

function loadInitialConfig() {
  // 1. Try localStorage first (most recent edits)
  try {
    const stored = localStorage.getItem(LS_KEY);
    if (stored) {
      const cfg = JSON.parse(stored);
      return cfg;
    }
  } catch (e) {}
  return null; // will use DEFAULT_LAYOUT
}

// Priority: localStorage > DEFAULT_LAYOUT
const INIT_CONFIG = loadInitialConfig();

/* ================================================================
   POSTER APP
   ================================================================ */
function PosterApp() {
  const [layout, setLayout] = useState(
    INIT_CONFIG ? cloneLayout({ columns: INIT_CONFIG.columns }) : cloneLayout(DEFAULT_LAYOUT)
  );
  const [selectedCard, setSelectedCard] = useState(null);
  const [cardHeights, setCardHeights] = useState(
    INIT_CONFIG?.cardHeights || { ...DEFAULT_CARD_HEIGHTS }
  );
  const [preview, setPreview] = useState(false);
  const [logos, setLogos] = useState(INIT_CONFIG?.logos || DEFAULT_LOGOS);
  const [fontScale, setFontScaleState] = useState(
    INIT_CONFIG?.fontScale || DEFAULT_FONT_SCALE
  );
  const currentScaleRef = useRef(1);
  const posterRef = useRef(null);
  const bodyRef = useRef(document.body);

  /* ---- Auto-save to localStorage on every change ---- */
  useEffect(() => {
    const cfg = getFullConfig(layout, cardHeights, fontScale, logos);
    localStorage.setItem(LS_KEY, JSON.stringify(cfg));
  }, [layout, cardHeights, fontScale, logos]);

  /* ---- Apply font scale to CSS ---- */
  useEffect(() => {
    document.documentElement.style.setProperty('--font-scale', fontScale);
  }, [fontScale]);

  /* ---- Preview mode: toggle body class ---- */
  useEffect(() => {
    document.body.classList.toggle('preview', preview);
  }, [preview]);

  /* ---- Viewport scaling ---- */
  const fit = useCallback(() => {
    if (window.matchMedia('print').matches) return;
    const posterW = 841 * MM;
    const posterH = 594 * MM;
    const scale = Math.min(window.innerWidth / posterW, window.innerHeight / posterH);
    currentScaleRef.current = scale;
    const left = (window.innerWidth - posterW * scale) / 2;
    const top = (window.innerHeight - posterH * scale) / 2;
    document.body.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
  }, []);

  useEffect(() => {
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [fit]);

  /* ---- KaTeX rendering after React updates ---- */
  useEffect(() => {
    if (typeof renderMathInElement === 'function') {
      renderMathInElement(document.body, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });
    }
  });

  /* ---- Click outside to deselect ---- */
  useEffect(() => {
    function handler(e) {
      if (selectedCard && !e.target.closest('.swap-handle') && !e.target.closest('.drop-zone')) {
        setSelectedCard(null);
      }
    }
    document.addEventListener('click', handler);
    return () => document.removeEventListener('click', handler);
  }, [selectedCard]);

  /* ---- Find which column a card is in ---- */
  function findCardColumn(cardId) {
    for (const col of layout.columns) {
      const idx = col.cards.indexOf(cardId);
      if (idx !== -1) return { col, idx };
    }
    return null;
  }

  /* ---- Swap two cards ---- */
  function swapCards(id1, id2) {
    if (id1 === id2) return false;
    setLayout(prev => {
      const next = cloneLayout(prev);
      let loc1 = null, loc2 = null;
      for (const col of next.columns) {
        const i1 = col.cards.indexOf(id1);
        if (i1 !== -1) loc1 = { col, idx: i1 };
        const i2 = col.cards.indexOf(id2);
        if (i2 !== -1) loc2 = { col, idx: i2 };
      }
      if (!loc1 || !loc2) return prev;
      loc1.col.cards[loc1.idx] = id2;
      loc2.col.cards[loc2.idx] = id1;
      return next;
    });
    // Clear explicit heights so cards adapt to new column
    setCardHeights(prev => {
      const next = { ...prev };
      delete next[id1];
      delete next[id2];
      return next;
    });
    return true;
  }

  /* ---- Move card to a specific position ---- */
  function moveCard(cardId, targetColId, position) {
    setLayout(prev => {
      const next = cloneLayout(prev);
      for (const col of next.columns) {
        const idx = col.cards.indexOf(cardId);
        if (idx !== -1) {
          col.cards.splice(idx, 1);
          break;
        }
      }
      const targetCol = next.columns.find(c => c.id === targetColId);
      if (!targetCol) return prev;
      const pos = Math.max(0, Math.min(position, targetCol.cards.length));
      targetCol.cards.splice(pos, 0, cardId);
      return next;
    });
    // Clear explicit height so card adapts to new column
    setCardHeights(prev => {
      const next = { ...prev };
      delete next[cardId];
      return next;
    });
  }

  /* ---- Set column width ---- */
  function setColumnWidth(colId, widthMm) {
    setLayout(prev => {
      const next = cloneLayout(prev);
      const col = next.columns.find(c => c.id === colId);
      if (!col) return prev;
      col.widthMm = widthMm;
      return next;
    });
  }

  /* ---- Set card height ---- */
  function setCardHeight(cardId, heightMm) {
    setCardHeights(prev => ({ ...prev, [cardId]: heightMm }));
  }

  /* ---- Get waste ---- */
  function getWaste() {
    let total = 0;
    const details = [];
    document.querySelectorAll('.fig-wrap').forEach(fw => {
      const img = fw.querySelector('img');
      if (!img) return;
      const fr = fw.getBoundingClientRect();
      const ir = img.getBoundingClientRect();
      const wH = Math.abs(fr.height - ir.height);
      const wW = Math.abs(fr.width - ir.width);
      total += wH + wW;
      const card = fw.closest('.card');
      details.push({
        card: card ? card.dataset.id : 'unknown',
        wasteH: Math.round(wH),
        wasteW: Math.round(wW),
        pct: Math.round((wH + wW) / (fr.height + fr.width) * 100),
      });
    });
    return { total: Math.round(total), details };
  }

  /* ---- Get layout ---- */
  function getLayout() {
    const scale = currentScaleRef.current;
    const result = [];
    document.querySelectorAll('#poster > .col').forEach(col => {
      const cards = [];
      col.querySelectorAll('.card').forEach(c => {
        const r = c.getBoundingClientRect();
        cards.push({
          id: c.dataset.id,
          height: Math.round(r.height / scale),
          heightMm: Math.round(r.height / scale / MM),
          grow: c.classList.contains('grow'),
        });
      });
      result.push({
        colId: col.id,
        widthPx: Math.round(col.getBoundingClientRect().width / scale),
        widthMm: Math.round(col.getBoundingClientRect().width / scale / MM),
        cards,
      });
    });
    return result;
  }

  /* ---- Reset layout ---- */
  function resetLayout() {
    setLayout(cloneLayout(DEFAULT_LAYOUT));
    setCardHeights({ ...DEFAULT_CARD_HEIGHTS });
    setFontScaleState(DEFAULT_FONT_SCALE);
    setLogos([...DEFAULT_LOGOS]);
    setSelectedCard(null);
    localStorage.removeItem(LS_KEY);
  }

  /* ---- Save config as downloadable JSON ---- */
  function saveConfig() {
    const cfg = getFullConfig(layout, cardHeights, fontScale, logos);
    const blob = new Blob([JSON.stringify(cfg, null, 2) + '\n'], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'poster-config.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  /* ---- Copy config to clipboard ---- */
  function copyConfig() {
    const cfg = getFullConfig(layout, cardHeights, fontScale, logos);
    navigator.clipboard.writeText(JSON.stringify(cfg, null, 2)).then(() => {
      alert('Config copied to clipboard! Paste it to Claude to update your poster.');
    });
  }

  /* ---- Handle click ---- */
  function handleSwapClick(cardId, e) {
    e.stopPropagation();
    if (!selectedCard) {
      setSelectedCard(cardId);
    } else if (selectedCard === cardId) {
      setSelectedCard(null);
    } else {
      swapCards(selectedCard, cardId);
      setSelectedCard(null);
    }
  }

  /* ---- Handle drop zone click ---- */
  function handleDropZone(targetColId, position, e) {
    e.stopPropagation();
    if (!selectedCard) return;
    moveCard(selectedCard, targetColId, position);
    setSelectedCard(null);
  }

  /* ---- Column resize handler ---- */
  function handleColResize(dividerIdx, e) {
    e.preventDefault();
    const handle = e.currentTarget;
    handle.classList.add('active');

    const targetColIdx = dividerIdx === 0 ? 0 : 2;
    const invert = dividerIdx === 0 ? 1 : -1;
    const targetEl = document.getElementById(layout.columns[targetColIdx].id);

    const startX = e.clientX;
    const scale = currentScaleRef.current;
    // getBoundingClientRect returns VISUAL (scaled) pixels — unscale to get CSS pixels
    const startW = targetEl.getBoundingClientRect().width / scale;

    function onMove(ev) {
      const dx = (ev.clientX - startX) / scale * invert;
      const newW = Math.max(120, (startW + dx) / MM);

      setLayout(prev => {
        const next = cloneLayout(prev);
        next.columns[targetColIdx].widthMm = Math.round(newW);
        return next;
      });
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      handle.classList.remove('active');
      document.body.style.cursor = '';
    }
    document.body.style.cursor = 'col-resize';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  /* ---- Row resize handler ---- */
  // Only pins the TOP card's height. The bottom card (or whichever has grow)
  // absorbs the change, so the column always fills edge-to-edge.
  function handleRowResize(colId, cardAboveIdx, e) {
    e.preventDefault();
    const handle = e.currentTarget;
    handle.classList.add('active');

    const col = layout.columns.find(c => c.id === colId);
    const aboveId = col.cards[cardAboveIdx];

    const aboveEl = document.querySelector('[data-id="' + aboveId + '"]');
    if (!aboveEl) return;

    const startY = e.clientY;
    const scale = currentScaleRef.current;
    const startH = aboveEl.getBoundingClientRect().height / scale;

    // Pin above card to its current height
    setCardHeights(prev => ({ ...prev, [aboveId]: startH / MM }));

    function onMove(ev) {
      const dy = (ev.clientY - startY) / scale;
      setCardHeights(prev => ({ ...prev, [aboveId]: Math.max(20, (startH + dy) / MM) }));
    }

    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      handle.classList.remove('active');
      document.body.style.cursor = '';
    }
    document.body.style.cursor = 'row-resize';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }

  /* ---- Determine card grow state ---- */
  // Each column must have exactly one grow card to fill all space.
  // If a card has an explicit height, it never grows.
  // Otherwise, use the registry default. If no card in the column would grow,
  // the last card in that column automatically gets grow.
  function isCardGrow(cardId) {
    if (cardHeights[cardId] != null) return false;
    // Find which column this card is in
    for (const col of layout.columns) {
      const idx = col.cards.indexOf(cardId);
      if (idx === -1) continue;
      // Check if any card in this column has registry grow AND no explicit height
      const hasGrower = col.cards.some(
        cid => CARD_REGISTRY[cid].grow && cardHeights[cid] == null
      );
      if (hasGrower) {
        // Use registry default
        return CARD_REGISTRY[cardId].grow;
      } else {
        // No grower — last card without explicit height gets grow
        const lastFlexible = [...col.cards].reverse().find(cid => cardHeights[cid] == null);
        return cardId === lastFlexible;
      }
    }
    return false;
  }

  /* ---- Font scale ---- */
  function setFontScale(s) {
    setFontScaleState(parseFloat(s) || 1.3);
  }

  /* ---- Expose API on window ---- */
  useEffect(() => {
    window.posterAPI = {
      swapCards,
      moveCard,
      setColumnWidth,
      setCardHeight,
      setFontScale,
      getWaste,
      getLayout,
      getConfig: () => getFullConfig(layout, cardHeights, fontScale, logos),
      resetLayout,
      saveConfig,
      copyConfig,
    };
  });

  /* ---- Render a card ---- */
  function renderCard(cardId) {
    const card = CARD_REGISTRY[cardId];
    if (!card) return null;

    const colorClass = card.color || '';
    const grow = isCardGrow(cardId);
    const heightMm = cardHeights[cardId];
    const isSelected = selectedCard === cardId;

    const classes = ['card'];
    if (colorClass) classes.push(colorClass);
    if (grow) classes.push('grow');
    if (isSelected) classes.push('swap-selected');

    const style = {};
    if (heightMm != null) {
      style.flex = '0 0 ' + heightMm + 'mm';
    }

    return (
      <div
        key={cardId}
        className={classes.join(' ')}
        data-id={cardId}
        style={style}
      >
        <div className="swap-handle" onClick={(e) => handleSwapClick(cardId, e)}>&#x2725;</div>
        <h2>{card.title}</h2>
        {card.body}
      </div>
    );
  }

  /* ---- Render a drop zone ---- */
  function renderDropZone(colId, position) {
    const visible = selectedCard !== null;
    return (
      <div
        key={'dz-' + colId + '-' + position}
        className={'drop-zone' + (visible ? ' visible' : '')}
        onClick={(e) => handleDropZone(colId, position, e)}
      >
        {visible && <div className="drop-zone-inner" />}
      </div>
    );
  }

  /* ---- Render a column ---- */
  function renderColumn(col, colIdx) {
    const style = {};
    if (col.widthMm != null) {
      style.flex = '0 0 ' + col.widthMm + 'mm';
    } else {
      style.flex = '1.5';
    }

    const children = [];

    // Drop zone at top
    children.push(renderDropZone(col.id, 0));

    col.cards.forEach((cardId, i) => {
      children.push(renderCard(cardId));

      // Row divider between cards
      if (i < col.cards.length - 1) {
        children.push(
          <div
            key={'row-' + col.id + '-' + i}
            className="divider row-resize"
            onMouseDown={(e) => handleRowResize(col.id, i, e)}
          />
        );
      }

      // Drop zone after each card
      children.push(renderDropZone(col.id, i + 1));
    });

    return (
      <div key={col.id} className="col" id={col.id} style={style}>
        {children}
      </div>
    );
  }

  return (
    <>
      <div className="toolbar">
        <button onClick={() => setPreview(!preview)} style={preview ? {background:'#2d7fc1',color:'#fff'} : {}}>{preview ? 'Edit' : 'Preview'}</button>
        {!preview && <>
          <button onClick={() => setFontScale(Math.max(0.8, fontScale - 0.1))}>A-</button>
          <button onClick={() => setFontScale(fontScale + 0.1)}>A+</button>
          <button onClick={saveConfig} title="Download poster-config.json">Save</button>
          <button onClick={copyConfig} title="Copy config JSON to clipboard">Copy Config</button>
          <button onClick={resetLayout}>Reset</button>
        </>}
      </div>

      <div className="header">
        <div className="header-left">
          <h1><span className="m">Fillerbuster:</span> Unified Generative Scene Completion Model for Casual Captures</h1>
          <div className="authors">Ethan Weber<sup>1,2</sup> &nbsp; Norman M&uuml;ller<sup>1</sup> &nbsp; Yash Kant<sup>1,3</sup> &nbsp; Vasu Agrawal<sup>1</sup> &nbsp; Michael Zollh&ouml;fer<sup>1</sup> &nbsp; Angjoo Kanazawa<sup>2</sup> &nbsp; Christian Richardt<sup>1</sup></div>
          <div className="aff"><sup>1</sup>Meta Reality Labs &bull; <sup>2</sup>UC Berkeley &bull; <sup>3</sup>University of Toronto</div>
        </div>
        {logos.length > 0 && (
          <div className="header-logos">
            {logos.map((logo, i) => (
              <img key={i} src={logo.src} alt={logo.alt} style={{height: (logo.heightMm || 18) + 'mm'}} />
            ))}
          </div>
        )}
        <div className="header-right">
          <div className="badge">3DV 2026</div>
          <div className="qr"><img src="qr.png" alt="QR" /><div className="ql">Project page</div></div>
          <div className="qr"><img src="qr-posterskill.png" alt="Posterskill" /><div className="ql">Poster made with my Claude skill</div></div>
        </div>
      </div>

      <div className="poster" id="poster" ref={posterRef}>
        {layout.columns.map((col, colIdx) => {
          const elements = [];
          if (colIdx > 0) {
            elements.push(
              <div
                key={'col-div-' + colIdx}
                className="divider col-resize"
                onMouseDown={(e) => handleColResize(colIdx - 1, e)}
              />
            );
          }
          elements.push(renderColumn(col, colIdx));
          return elements;
        })}
      </div>

    </>
  );
}

/* ================================================================
   MOUNT
   ================================================================ */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PosterApp />);
</script>
</body>
</html>
